<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12263A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NCM Inspection</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">NCM</div>
    <span id="mock-badge" class="badge badge-mock" hidden data-i18n="common.mock"></span>
    <span id="net" class="net" role="status"></span>
    <span id="pending" class="badge" role="status"></span>
    <button id="lang-toggle" class="btn-lang" type="button"></button>
  </header>

  <div id="update-bar" class="update-bar" hidden>
    <span data-i18n="common.updateAvailable"></span>
    <button id="update-btn" type="button" class="btn btn-small" data-i18n="common.updateNow"></button>
  </div>

  <main id="app" tabindex="-1"></main>

  <div id="toast" class="toast" role="alert" hidden></div>

  <footer class="footer"><span data-i18n="common.version"></span> <span id="app-version"></span></footer>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
